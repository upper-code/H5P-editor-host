name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository; nothing here needs a write token.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suites spawn and stop child processes (startup, process-lock); one
    # that hangs must fail the run long before the 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Asset URLs carry the package version and are cached for a year, so a
      # change to the vendored runtime must come with a version bump. The test
      # suite checks a recorded digest, which a commit can rewrite; this
      # compares with the commit the change is based on instead.
      - name: Check the runtime cache version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then exit 0; fi
          # A pull request's base always exists, so failing to fetch it fails
          # the check; after a force push the previous head may be gone.
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            if [[ "$EVENT" == pull_request ]]; then exit 1; fi
            echo "::warning::Base commit $BASE_SHA is not available; runtime version check skipped."
            exit 0
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- assets/h5p/core assets/h5p/editor; then exit 0; fi
          before=$(git show "$BASE_SHA:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          after=$(node -p "require('./package.json').version")
          if [[ "$before" == "$after" ]]; then
            echo "::error::assets/h5p/{core,editor} changed without a package version bump (still $after)."
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Builds, then runs the unit suite. No H5P library bundle is needed: the
      # tests that touch provisioning build their own fixtures.
      - run: npm test
      # Browser regressions use only the committed core assets, without a host
      # server or provisioned content libraries. The browser build is cached
      # per Playwright version; system libraries are not cached, so the
      # install step still runs on a hit (it then only adds the OS packages).
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # Fails on any high/critical advisory except a short, dated allowlist for
      # image-size (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq), an h5p-server
      # dependency with no fixed 1.x release (docs/DESIGN_DECISIONS.md): npm
      # audit sees the published version,
      # not the local parser fix (scripts/patch-image-size.mjs, run in
      # postinstall; the test suite exercises the patched parser). Unlike a
      # blanket `--audit-level=critical`, an unrelated future high advisory
      # still fails the build. Once a fixed image-size ships, retire the patch
      # and the allowlist in scripts/audit-allowlist.mjs.
      - run: npm run audit:ci
